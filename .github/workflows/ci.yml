name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Run ESLint directly so the backend's developer-facing `lint` script
      # (which applies autofixes) cannot silently modify the CI checkout.
      - name: Lint frontend and backend
        run: |
          pnpm --dir apps/web exec eslint .
          pnpm --dir apps/storefront exec eslint .
          pnpm --dir apps/backend exec eslint "src/**/*.ts"

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production builds
        env:
          BACKEND_URL: http://backend:4000
        run: pnpm build

  docker:
    name: Compose and Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Compose services
        run: docker compose build backend web storefront
