name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Run ESLint directly so no developer-facing lint script can silently
      # apply fixes and modify the CI checkout.
      - name: Lint frontend
        run: |
          pnpm --dir apps/web exec eslint .
          pnpm --dir apps/storefront exec eslint .

      # The backend currently has legacy lint findings outside the changed
      # files. Lint touched backend sources so each PR is checked without
      # making unrelated existing files block it.
      - name: Lint changed backend files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          mapfile -t files < <(git diff --name-only "$base_sha...$GITHUB_SHA" -- apps/backend/src | sed 's#^apps/backend/##' | grep -E '\.tsx?$' || true)
          if (( ${#files[@]} == 0 )); then
            echo "No backend source files changed; skipping backend lint."
          else
            pnpm --dir apps/backend exec eslint "${files[@]}"
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production builds
        env:
          BACKEND_URL: http://backend:4000
        run: pnpm build

  docker:
    name: Compose and Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Compose services
        run: docker compose build backend web storefront
